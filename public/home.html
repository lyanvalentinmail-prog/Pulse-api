<!doctype html>
<html lang="es">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <meta name="theme-color" content="#efefef" />
        <title>Pulse API — Dashboard</title>
        <link rel="canonical" href="/" />
        <link rel="icon" type="image/png" href="/favicon-96x96.png" sizes="96x96" />
        <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
        <link rel="shortcut icon" href="/favicon.ico" />
        <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
        <link rel="manifest" href="/site.webmanifest" />
        <meta property="og:description" content="REST API gratis, sin token: anime, canvas, IA, descargas, búsquedas, imágenes, herramientas, juegos y audios." />
        <meta property="og:image" content="/img/banner.jpg" />
        <meta name="author" content="lyanvalentinmail-prog" />
        <meta name="description" content="REST API gratis, sin token: anime, canvas, IA, descargas, búsquedas, imágenes, herramientas, juegos y audios." />
        <link rel="stylesheet" href="/css/style.css" />
    </head>
    <body>
        <div class="wrap">
            <main class="card" id="api-container">
                <header>
                    <h1 class="title" id="header"><a href="/welcome" title="Portada">Pulse API</a></h1>
                    <div class="sync" id="fetching">Linking system…</div>
                    <p class="intro">
                        Carpetas con todas las <b>APIs</b> disponibles.
                        <span class="token-note">(No requiere token)</span>
                    </p>
                </header>

                <div class="icons">
                    <div class="left left-controls">
                        <a href="/home" class="icon-btn" title="Inicio" aria-label="Inicio">
                            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M3 10.2 12 3l9 7.2V20a1.8 1.8 0 0 1-1.8 1.8H4.8A1.8 1.8 0 0 1 3 20z"></path>
                                <path d="M9.5 21.8v-7h5v7"></path>
                            </svg>
                        </a>
                        <a href="/information" class="icon-btn" title="Información del sistema" aria-label="Información del sistema">
                            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M22 12h-4l-3 8.5L9 3.5 6 12H2"></path>
                            </svg>
                        </a>
                        <a href="/docs" class="icon-btn" title="Catálogo JSON (/docs)" aria-label="Catálogo JSON">
                            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round">
                                <rect x="2.5" y="3" width="19" height="7.5" rx="2"></rect>
                                <rect x="2.5" y="13.5" width="19" height="7.5" rx="2"></rect>
                                <path d="M6.5 6.75h.01M6.5 17.25h.01"></path>
                            </svg>
                        </a>
                        <a href="https://github.com/lyanvalentinmail-prog" target="_blank" rel="noopener" id="link-github" class="icon-btn" title="Follow my github account" aria-label="Follow my github account">
                            <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor">
                                <path d="M12 .5C5.65.5.5 5.65.5 12c0 5.08 3.29 9.39 7.86 10.91.58.11.79-.25.79-.56 0-.27-.01-1.17-.02-2.12-3.2.7-3.88-1.36-3.88-1.36-.52-1.33-1.28-1.68-1.28-1.68-1.04-.71.08-.7.08-.7 1.15.08 1.76 1.19 1.76 1.19 1.03 1.76 2.69 1.25 3.35.96.1-.75.4-1.25.72-1.54-2.55-.29-5.24-1.28-5.24-5.69 0-1.26.45-2.28 1.19-3.09-.12-.29-.52-1.46.11-3.05 0 0 .97-.31 3.17 1.18a11.1 11.1 0 0 1 5.78 0c2.2-1.49 3.17-1.18 3.17-1.18.63 1.59.23 2.76.11 3.05.74.81 1.19 1.83 1.19 3.09 0 4.42-2.7 5.39-5.26 5.68.41.36.78 1.06.78 2.14 0 1.54-.01 2.79-.01 3.17 0 .31.21.68.8.56A10.52 10.52 0 0 0 23.5 12C23.5 5.65 18.35.5 12 .5z"></path>
                            </svg>
                        </a>
                        <button type="button" id="refresh-btn" class="icon-btn" title="Volver a sincronizar" aria-label="Volver a sincronizar">
                            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M21 12a9 9 0 1 1-2.64-6.36"></path>
                                <polyline points="21 3 21 9 15 9"></polyline>
                            </svg>
                        </button>
                    </div>
                    <button type="button" id="search-trigger" class="icon-btn" aria-label="Buscar" aria-expanded="false" aria-controls="search-input-container">
                        <svg class="search-icon" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round">
                            <circle cx="11" cy="11" r="8"></circle>
                            <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                        </svg>
                        <svg class="close-icon" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" style="display: none">
                            <line x1="18" y1="6" x2="6" y2="18"></line>
                            <line x1="6" y1="6" x2="18" y2="18"></line>
                        </svg>
                    </button>
                </div>

                <div class="searchbox" id="search-input-container">
                    <input type="text" id="search-input" placeholder="Buscar carpetas…" autocomplete="off" aria-label="Buscar carpetas" />
                </div>

                <div class="status stats-bar">
                    <span class="stat-item">Status: online</span>
                    <div class="right">
                        <span id="stat-routers" class="stat"><span class="sk sk-stat"></span></span>
                        <span id="stat-endpoints" class="stat"><span class="sk sk-stat"></span></span>
                    </div>
                </div>

                <div class="list" id="category-list">
                    <div class="row is-skeleton">
                        <span class="sk sk-icon"></span>
                        <div class="info"><span class="sk sk-title"></span><span class="sk sk-sub"></span></div>
                        <span class="sk sk-btn"></span>
                    </div>
                    <div class="row is-skeleton">
                        <span class="sk sk-icon"></span>
                        <div class="info"><span class="sk sk-title"></span><span class="sk sk-sub"></span></div>
                        <span class="sk sk-btn"></span>
                    </div>
                    <div class="row is-skeleton">
                        <span class="sk sk-icon"></span>
                        <div class="info"><span class="sk sk-title"></span><span class="sk sk-sub"></span></div>
                        <span class="sk sk-btn"></span>
                    </div>
                    <div class="row is-skeleton">
                        <span class="sk sk-icon"></span>
                        <div class="info"><span class="sk sk-title"></span><span class="sk sk-sub"></span></div>
                        <span class="sk sk-btn"></span>
                    </div>
                </div>

                <footer class="footer">
                    &copy; <span id="year"></span> | <b>PULSE STORE</b> · <span id="stat-requests">0</span> <span class="req">requests</span>
                </footer>
            </main>
        </div>

        <script>
            (function () {
                const $ = sel => document.querySelector(sel);
                const esc = s => String(s ?? '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
                let categories = [];

                const FOLDER_ICON =
                    '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linejoin="round"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"></path></svg>';

                // Total de pruebas ejecutadas desde la web (lo guarda /js/category.js).
                function totalRequests() {
                    try {
                        const hits = JSON.parse(localStorage.getItem('pulse:hits') || '{}');
                        return Object.values(hits).reduce((n, v) => n + (Number(v) || 0), 0);
                    } catch (_) {
                        return 0;
                    }
                }

                async function loadDynamicMenu() {
                    const listContainer = $('#category-list');
                    $('#fetching').textContent = 'Linking system…';
                    try {
                        const response = await fetch('/docs', { headers: { accept: 'application/json' } });
                        const data = await response.json();

                        if (data.links) {
                            const gh = document.querySelector('#link-github');
                            if (gh && data.links.github) gh.href = data.links.github;
                        }

                        const fromDocs = Array.isArray(data.categories) ? data.categories : [];
                        const tags = data.tags || {};
                        categories = (fromDocs.length ? fromDocs : Object.keys(tags).map(id => ({ id, count: tags[id].length })))
                            .map(c => ({ id: c.id, count: c.count || 0, desc: c.desc || '' }))
                            .sort((a, b) => a.id.localeCompare(b.id));

                        renderCategories(categories);
                        $('#fetching').textContent = 'Sync complete';
                    } catch (error) {
                        listContainer.innerHTML =
                            '<div class="row"><div class="info"><h3>Failed to load database</h3><div class="meta">Revisa la conexión y vuelve a sincronizar.</div></div></div>';
                        $('#fetching').textContent = 'Link error';
                    }
                }

                function renderCategories(list) {
                    const listContainer = $('#category-list');
                    const tEndpoints = list.reduce((n, c) => n + c.count, 0);

                    $('#stat-routers').textContent = `Routers: ${list.length}`;
                    $('#stat-endpoints').textContent = `Endpoints: ${tEndpoints}`;

                    const html = list
                        .map(c => `
                        <a href="/${esc(c.id)}" class="row folder">
                            <span class="row-icon">${FOLDER_ICON}</span>
                            <div class="info">
                                <h3>${esc(c.id)}</h3>
                                <div class="meta"><span class="count">${c.count} endpoints</span><span class="sep">·</span>${esc(c.desc || 'Colección de endpoints')}</div>
                            </div>
                            <span class="cat-ver">View</span>
                        </a>`)
                        .join('');

                    listContainer.innerHTML =
                        html || '<div class="row"><div class="info"><h3>Empty database</h3></div></div>';
                }

                $('#search-trigger').addEventListener('click', function () {
                    const box = $('#search-input-container');
                    const open = box.classList.toggle('open');
                    this.setAttribute('aria-expanded', String(open));
                    this.setAttribute('aria-label', open ? 'Cerrar búsqueda' : 'Buscar');
                    $('.search-icon').style.display = open ? 'none' : '';
                    $('.close-icon').style.display = open ? '' : 'none';
                    const input = $('#search-input');
                    if (open) input.focus();
                    else {
                        input.value = '';
                        input.dispatchEvent(new Event('input'));
                    }
                });

                $('#search-input').addEventListener('input', function () {
                    const term = this.value.trim().toLowerCase();
                    const filtered = categories.filter(c => `${c.id} ${c.desc}`.toLowerCase().includes(term));
                    renderCategories(filtered);
                });

                const refreshBtn = $('#refresh-btn');
                if (refreshBtn) {
                    refreshBtn.addEventListener('click', () => {
                        const input = $('#search-input');
                        if (input && input.value) {
                            input.value = '';
                            input.dispatchEvent(new Event('input'));
                        }
                        loadDynamicMenu();
                    });
                }

                $('#year').textContent = new Date().getFullYear();
                $('#stat-requests').textContent = totalRequests();
                loadDynamicMenu();
            })();
        </script>
    </body>
</html>
