        <style>
            :root {
                --primary: #000;
                --secondary: #777;
                --bg-card: #ffffff;
                --border: #ececec;
                --dot-color: #d1d1d1;
                --dot-pattern: radial-gradient(var(--dot-color) 1px, transparent 1px);
                --sk-base: #f0f0f0;
            }
            body {
                font-family: "Share Tech Mono", monospace;
                margin: 0;
                display: flex;
                justify-content: center;
                align-items: center;
                min-height: 100vh;
                background-image: var(--dot-pattern);
                background-size: 20px 20px;
                color: var(--primary);
            }
            #api-container {
                width: 360px;
                height: 550px;
                padding: 25px;
                background-color: var(--bg-card);
                background-image: var(--dot-pattern);
                background-size: 15px 15px;
                border-radius: 16px;
                border: 2px solid var(--primary);
                display: flex;
                flex-direction: column;
                overflow: hidden;
                position: relative;
                box-shadow: 8px 8px 0px rgba(0, 0, 0, 0.05);
            }
            header {
                text-align: center;
                margin-bottom: 5px;
            }
            #header {
                font-size: 26px;
                margin: 0;
                letter-spacing: 1px;
                text-transform: uppercase;
            }
            #fetching {
                font-size: 10px;
                color: var(--secondary);
                text-transform: uppercase;
                margin-top: 4px;
            }
            .description {
                font-size: 11px;
                margin: 10px 0 5px 0;
                color: var(--primary);
                line-height: 1.4;
                text-align: center;
            }
            .github-link {
                display: block;
                margin-top: 5px;
                color: var(--primary);
                text-decoration: underline;
                font-weight: bold;
            }
            .table-wrapper::-webkit-scrollbar {
                width: 4px;
            }
            .table-wrapper::-webkit-scrollbar-track {
                background: transparent;
            }
            .table-wrapper::-webkit-scrollbar-thumb {
                background: var(--primary);
                border-radius: 10px;
            }
            .table-wrapper {
                flex-grow: 1;
                overflow-y: auto;
                margin-top: 10px;
                padding-right: 8px;
                display: flex;
                flex-direction: column;
            }
            .search-area {
                margin-bottom: 5px;
            }
            .controls-wrapper {
                display: flex;
                justify-content: space-between;
                align-items: center;
                padding: 8px 5px;
                border-bottom: 1px solid var(--border);
            }
            .left-controls {
                display: flex;
                gap: 15px;
                align-items: center;
            }
            .icon-btn {
                cursor: pointer;
                color: var(--primary);
                display: flex;
                align-items: center;
                transition: opacity 0.2s;
            }
            .icon-btn:hover {
                opacity: 0.7;
            }
            #search-input-container {
                display: none;
                margin: 10px 0;
            }
            #search-input {
                width: 100%;
                padding: 10px;
                box-sizing: border-box;
                border: 2px solid var(--primary);
                font-family: inherit;
                font-size: 16px;
                outline: none;
                border-radius: 4px;
                text-transform: uppercase;
            }
            .stats-bar {
                display: flex;
                justify-content: space-between;
                align-items: center;
                font-size: 8.5px;
                padding: 6px 10px;
                background: var(--primary);
                color: #fff;
                border-radius: 4px;
                margin-top: 5px;
            }
            .stat-item {
                display: flex;
                align-items: center;
                gap: 4px;
            }
            .api-item {
                display: flex;
                align-items: center;
                justify-content: space-between;
                padding: 14px 10px;
                border-bottom: 1px solid var(--border);
                transition: all 0.2s ease;
                background: rgba(255, 255, 255, 0.7);
                margin-bottom: 5px;
                text-decoration: none;
                color: inherit;
            }
            .api-item:hover {
                background: var(--primary);
                color: #fff;
            }
            .folder-info {
                display: flex;
                align-items: center;
                gap: 12px;
            }
            .folder-name {
                font-size: 14px;
                font-weight: bold;
                text-transform: uppercase;
                letter-spacing: 0.5px;
            }
            .folder-count {
                font-size: 9px;
                opacity: 0.6;
            }
            .btn-open {
                background: var(--primary);
                color: #fff;
                border: 1px solid var(--primary);
                padding: 5px 10px;
                font-size: 10px;
                border-radius: 4px;
                font-family: inherit;
                cursor: pointer;
            }
            .api-item:hover .btn-open {
                background: #fff;
                color: var(--primary);
            }
            .footer {
                margin-top: 15px;
                padding-top: 15px;
                font-size: 10px;
                border-top: 2px solid var(--primary);
                text-align: center;
                color: var(--secondary);
            }


            .skeleton {
                background-color: var(--sk-base);
                position: relative;
                overflow: hidden;
                border-radius: 3px;
            }
            .skeleton::after {
                content: "";
                position: absolute;
                top: 0;
                right: 0;
                bottom: 0;
                left: 0;
                transform: translateX(-100%);
                background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.8), transparent);
                animation: shimmer 1.2s infinite;
            }
            @keyframes shimmer {
                100% {
                    transform: translateX(100%);
                }
            }
            .sk-stat {
                width: 50px;
                height: 8px;
                background-color: #333;
            }
            .sk-icon {
                width: 20px;
                height: 20px;
            }
            .sk-title {
                width: 100px;
                height: 12px;
                margin-bottom: 6px;
            }
            .sk-sub {
                width: 60px;
                height: 8px;
            }
            .sk-btn {
                width: 45px;
                height: 20px;
            }
        </style>

        <script src="/src.js"></script>
        <script>
            let categories = {};


            async function loadDynamicMenu() {
                const list_container = $("#category-list");
                try {
                    const response = await fetch("/docs");
                    const data = await response.json();


                    if (data.links) {
                        if (data.links.github) $("#link-github").attr("href", data.links.github);
                        if (data.links.patreon) $("#link-patreon").attr("href", data.links.patreon);
                        if (data.links.web) $("#link-web").attr("href", data.links.web);
                    }


                    categories = data.tags;
                    renderCategories(categories);
                    document.getElementById("fetching").textContent = "SYNC COMPLETE";
                } catch (error) {
                    list_container.html(
                        '<div style="text-align:center; font-size:11px; margin-top: 20px;">[!] FAILED_TO_LOAD_DATABASE</div>'
                    );
                }
            }


            function renderCategories(tags) {
                const list_container = $("#category-list");
                const keys = Object.keys(tags);


                let t_endpoints = 0;
                keys.forEach((key) => {
                    t_endpoints += tags[key].length;
                });


                $("#stat-routers").html(
                    `<svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"></path></svg> ROUTERS: ${keys.length}`
                );
                $("#stat-endpoints").html(
                    `<svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="2" width="20" height="8" rx="2" ry="2"></rect><rect x="2" y="14" width="20" height="8" rx="2" ry="2"></rect><line x1="6" y1="6" x2="6.01" y2="6"></line><line x1="6" y1="18" x2="6.01" y2="18"></line></svg> ENDPOINTS: ${t_endpoints}`
                );


                let html = keys
                    .map((key) => {
                        const count = tags[key].length;
                        return `
                     <a href="/${key}" class="api-item">
                         <div class="folder-info">
                             <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                 <path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"></path>
                             </svg>
                             <div>
                                 <div class="folder-name">${key}</div>
                                 <div class="folder-count">${count} endpoints</div>
                             </div>
                         </div>
                         <button class="btn-open">VIEW</button>
                     </a>
                 `;
                    })
                    .join("");
                list_container.html(
                    html || '<div style="text-align:center; font-size:11px; margin-top: 20px;">EMPTY_DATABASE</div>'
                );
            }


            $("#search-trigger").on("click", function () {
                const isVisible = $("#search-input-container").is(":visible");
                if (isVisible) {
                    $("#search-input").val("");
                    renderCategories(categories);
                    $("#search-input-container").slideUp(200);
                    $("#icon-close").hide();
                    $("#icon-search").show();
                } else {
                    $("#search-input-container").slideDown(200, () => $("#search-input").focus());
                    $("#icon-search").hide();
                    $("#icon-close").show();
                }
            });


            $("#search-input").on("input", function () {
                const val = $(this).val().toLowerCase();
                const filtered = {};
                Object.keys(categories).forEach((key) => {
                    if (key.toLowerCase().includes(val)) filtered[key] = categories[key];
                });
                renderCategories(filtered);
            });


            document.getElementById("year").textContent = new Date().getFullYear();
            loadDynamicMenu();
        </script>
